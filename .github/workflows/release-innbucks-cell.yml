# InnBucks cell release: build the pinned Fineract image, gate it on a Trivy
# scan, then push to GHCR with a signed build-provenance attestation.
#
# Trigger by pushing an immutable cell tag at the commit you are pinning:
#     git tag innbucks-cell-1 <commit>
#     git push origin innbucks-cell-1
# Upgrades are DELIBERATE: cut a new innbucks-cell-N tag; never rebuild a
# moving branch. The middleware cell deploys ghcr.io/mpofuslim/fineract
# pinned to the sha-<commit> (or cell) tag it was verified against.
#
# Supply-chain rules (match MpofuSlim/ticketing-system):
#   * every third-party action is pinned to an immutable commit SHA with a
#     trailing version comment — Dependabot bumps SHA + comment together
#   * least-privilege permissions, escalated per-job only
#   * the scan gates the push; the first run may well be RED — that is the
#     gate working. Waivers go to .trivyignore with owner/reason/review-date.
name: Release InnBucks cell image

on:
  push:
    tags: ["innbucks-cell-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# NOTE: no static IMAGE env here — the registry path must be LOWERCASE and
# github.repository_owner is "MpofuSlim"; docker rejects the mixed-case name.
# The first job step computes IMAGE with shell lowercasing into GITHUB_ENV.

jobs:
  # The Jib build below runs with -x test, so without this gate a cell tag on
  # a red commit would publish a fully-attested image that was never tested —
  # same reasoning as the middleware's release.yml test gate.
  test:
    name: Unit tests (gate)
    uses: ./.github/workflows/fork-ci.yml

  build-scan-push:
    name: Build, scan, push, attest
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Compute image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fineract" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full clone, tags included: Fineract's Gradle build derives its
          # version from `git describe` against the upstream release tags, and
          # the default shallow/tagless checkout fails at configure time with
          # "couldn't find matching tag in shallow git repository".
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build image with Jib (local daemon, no push yet)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :fineract-provider:jibDockerBuild -x test \
            -Djib.to.image=fineract-local:scan

      - name: Trivy scan (gates the push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fineract-local:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          timeout: 30m

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push sha + cell tags
        id: push
        run: |
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA}"
          docker tag fineract-local:scan "${SHA_TAG}"
          docker push "${SHA_TAG}"
          if [[ "${GITHUB_REF}" == refs/tags/innbucks-cell-* ]]; then
            CELL_TAG="${IMAGE}:${GITHUB_REF_NAME}"
            docker tag fineract-local:scan "${CELL_TAG}"
            docker push "${CELL_TAG}"
          fi
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${SHA_TAG}" | cut -d@ -f2)
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
